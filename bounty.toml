# Bounty Agent — example project configuration
config_version = 1
default_model = "qwen/qwen3.8-max"

[[providers]]
name = "deepseek"
kind = "openai"
base_url = "https://api.deepseek.com"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
api_key_env = "DEEPSEEK_API_KEY"
context_window = 1000000

[[providers]]
name = "qwen"
kind = "openai"
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode"
models = ["qwen3.8-max"]
api_key_env = "QWEN_TOKENPLAN_API_KEY"
context_window = 128000

[agent]
temperature = 0.0
compact_ratio = 0.8
max_steps = 50

# ── DeVET Integration ──
[devet]
enabled = true
base_url = "http://127.0.0.1:8765/api"

[remote]
enabled = false
# host = "myserver.example.com"
# user = "deploy"
# key = "~/.ssh/id_ed25519"
