name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (coverage)
        run: |
          go test ./internal/... ./cmd/... ./repro/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  devet:
    name: DeVET pytest (30/30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r third_party/vet-repro/requirements.txt
      - name: Run pytest
        working-directory: third_party/vet-repro
        run: python -m pytest tests -q
