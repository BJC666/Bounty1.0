name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    name: Go build / vet / fmt / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt check (changed files only)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1 || true
            files=$(git diff --name-only --diff-filter=ACM "origin/$GITHUB_BASE_REF..HEAD" -- "*.go")
          else
            files=$(git diff --name-only --diff-filter=ACM HEAD~1 -- "*.go")
          fi
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then echo "需要 gofmt 的文件："; echo "$unformatted"; exit 1; fi
          fi
          echo "gofmt OK"
      - name: Test
        run: go test ./... -count=1 -timeout=600s
      - name: Test coverage
        run: |
          go test ./internal/... ./cmd/... ./repro/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  selfcheck:
    name: Eval selfcheck (offline, 30 tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install typescript
        run: npm install -g typescript
      - name: Selfcheck
        run: python scripts/eval/selfcheck.py

  devet:
    name: DeVET pytest (30/30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r third_party/vet-repro/requirements.txt
      - name: Run pytest
        working-directory: third_party/vet-repro
        run: python -m pytest tests -q